name: CI

# Проверки идут и на PR, и на пуш в защищённые ветки: PR ловит поломку до
# вливания, пуш подтверждает, что слияние ничего не сломало.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

env:
  AIRFLOW_VERSION: "2.10.5"
  PYTHON_VERSION: "3.11"

jobs:
  dags:
    name: Разбор DAG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: airflow_dockerfile/requirements.txt

      - name: Установка Airflow и зависимостей
        run: |
          CONSTRAINTS="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          pip install "apache-airflow==${AIRFLOW_VERSION}" --constraint "$CONSTRAINTS"
          pip install -r airflow_dockerfile/requirements.txt --constraint "$CONSTRAINTS"

      - name: Инициализация метабазы
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow
        run: airflow db migrate

      - name: Импорт DAG
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python .github/scripts/check_dags.py

  compose:
    name: Валидация стенда
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Валидация docker-compose
        run: |
          cp .env.example .env
          docker compose config --quiet

  secrets:
    name: Секреты не в репозитории
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверка, что .env не закоммичен
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "Файл .env отслеживается git — секреты уедут в репозиторий." >&2
            exit 1
          fi
          echo "Секретов в индексе нет."
